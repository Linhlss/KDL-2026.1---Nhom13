<text x="353" y="491" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#16293e">A09 · TV5 kiểm suốt quá trình</text>
<text x="353" y="531" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#16293e">Nguồn → ODS → Fact → Mart → SQL/DAX; cùng kỳ, bộ lọc và version.</text>
<text x="36" y="623" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#506174">Thiết kế nhóm sẽ triển khai; số minh họa là tổng nguồn đã kiểm metadata. Chưa phải pipeline đã chạy.</text>
